name: Deploy to Surge

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sveltia-cms-publish]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Deploy to Surge
        uses: mahmoudgalalz/surge-action@v0.1.5
        with:
          domain: "melissa-portfolio.surge.sh"
          path: "./dist"
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
