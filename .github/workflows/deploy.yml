name: Deploy to Surge

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sveltia-cms-publish]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Astro
        run: bun run build

      - name: Deploy to Surge
        uses: mahmoudgalalz/surge-action@v0.1.5
        with:
          domain: 'melissa-portfolio.surge.sh'
          path: './dist'
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
