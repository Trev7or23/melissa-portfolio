name: biografia
label: Biografía
files:
  - name: biografia
    label: Biografía
    file: src/data/biografia.json
    fields:
      - { name: name, label: Nombre, widget: string }
      - { name: role, label: Rol, widget: string, hint: "Ej.: Artista visual" }
      - name: image
        label: Foto de la artista
        widget: image
        required: false
        hint: Retrato exclusivo para la sección de biografía, no una obra.
      - {
          name: imageAlt,
          label: Texto alternativo,
          widget: string,
          required: false,
          hint: "Descripción de la foto para accesibilidad.",
        }
