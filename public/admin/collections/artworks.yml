name: artworks
label: Obras
label_singular: Obra
folder: src/content/artworks
extension: md
create: true
delete: true
identifier_field: title
summary: "{{title}} · {{year}}"
sortable_fields: [order, year, title]
fields:
  - { name: title, label: Título, widget: string }
  - name: year
    label: Año
    widget: number
    value_type: int
    min: 1900
    max: 2100
  - { name: series, label: Serie, widget: string }
  - name: kind
    label: Tipo
    widget: select
    options:
      - { label: Obra maestra, value: obra-maestra }
      - { label: Serie, value: serie }
      - { label: Estudio, value: estudio }
      - { label: Encargo, value: encargo }
  - {
      name: technique,
      label: Técnica,
      widget: string,
      hint: "Ej.: Grafito 9B a 4H y difumino",
    }
  - {
      name: support,
      label: Soporte,
      widget: string,
      hint: "Ej.: Grafito puro sobre papel de algodón",
    }
  - {
      name: dimensions,
      label: Dimensiones,
      widget: string,
      hint: "Ej.: 70 × 100 cm",
    }
  - name: availability
    label: Disponibilidad
    widget: select
    options:
      - { label: Disponible para colección, value: Disponible para colección }
      - { label: Disponible, value: Disponible }
      - { label: Colección privada, value: Colección privada }
  - { name: description, label: Descripción, widget: text, required: false }
  - {
      name: curatorialStatement,
      label: Texto curatorial,
      widget: text,
      required: false,
    }
  - name: image
    label: Imagen
    widget: image
    required: false
    hint: Subí una foto o pegá una URL externa.
  - name: order
    label: Orden
    widget: number
    value_type: int
    required: false
    hint: "Menor número = aparece primero en la galería."
