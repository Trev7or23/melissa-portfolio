# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: Trev7or23/melissa-portfolio
  branch: main
  # OAuth client (required unless the site is hosted on Netlify).
  # Deploy https://github.com/sveltia/sveltia-cms-auth and uncomment:
  # base_url: https://sveltia-cms-auth.<your-subdomain>.workers.dev

# Astro serves public/ as-is, so uploads are referenced as /images/<file>
media_folder: public/images
public_folder: /images

# Astro's Zod schema rejects empty strings/nulls for optional fields
output:
  omit_empty_optional_fields: true

# Keep filenames ASCII and lowercase: el-anciano-del-tiempo.md
slug:
  clean_accents: true

collections:
  - name: artworks
    label: Obras
    label_singular: Obra
    folder: src/content/artworks
    extension: md
    create: true
    delete: true
    identifier_field: title
    summary: '{{title}} · {{year}}'
    sortable_fields: [order, year, title]
    fields:
      - { name: title, label: Título, widget: string }
      - name: year
        label: Año
        widget: number
        value_type: int
        min: 1900
        max: 2100
      - { name: series, label: Serie, widget: string }
      - name: kind
        label: Tipo
        widget: select
        options:
          - { label: Obra maestra, value: obra-maestra }
          - { label: Serie, value: serie }
          - { label: Estudio, value: estudio }
          - { label: Encargo, value: encargo }
      - { name: technique, label: Técnica, widget: string, hint: 'Ej.: Grafito 9B a 4H y difumino' }
      - { name: support, label: Soporte, widget: string, hint: 'Ej.: Grafito puro sobre papel de algodón' }
      - { name: dimensions, label: Dimensiones, widget: string, hint: 'Ej.: 70 × 100 cm' }
      - name: availability
        label: Disponibilidad
        widget: select
        options:
          - { label: Disponible para colección, value: Disponible para colección }
          - { label: Disponible, value: Disponible }
          - { label: Colección privada, value: Colección privada }
      - { name: description, label: Descripción, widget: text, required: false }
      - { name: curatorialStatement, label: Texto curatorial, widget: text, required: false }
      - name: image
        label: Imagen
        widget: image
        required: false
        hint: Subí una foto o pegá una URL externa.
      - name: order
        label: Orden
        widget: number
        value_type: int
        required: false
        hint: 'Menor número = aparece primero en la galería.'

  - name: biografia
    label: Biografía
    files:
      - name: biografia
        label: Biografía
        file: src/data/biografia.json
        fields:
          - { name: name, label: Nombre, widget: string }
          - { name: role, label: Rol, widget: string, hint: 'Ej.: Artista visual' }
          - name: image
            label: Foto de la artista
            widget: image
            required: false
            hint: Retrato exclusivo para la sección de biografía, no una obra.
          - { name: imageAlt, label: Texto alternativo, widget: string, required: false, hint: 'Descripción de la foto para accesibilidad.' }
